<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eye Disease Detection</title>
    <!-- Use the Inter font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom spinner animation */
        .spinner {
            border-top-color: #3b82f6; /* Tailwind's blue-500 */
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @-webkit-keyframes spinner {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-gray-800 rounded-xl shadow-2xl p-8 max-w-2xl w-full">
        <!-- Main Application Title -->
        <h1 class="text-3xl sm:text-4xl font-bold text-center mb-6 text-blue-400">
            Eye Disease Detector
        </h1>
        <p class="text-center text-gray-400 mb-8">
            Upload an image of a retina to check for common eye diseases.
        </p>

        <!-- Main Content Area -->
        <div id="main-content">
            <!-- Image Upload and Preview Section -->
            <div class="mb-8">
                <label for="file-input" class="cursor-pointer">
                    <div id="upload-box" class="flex flex-col items-center justify-center border-2 border-dashed border-gray-600 rounded-lg p-6 hover:bg-gray-700 transition-colors">
                        <svg class="w-12 h-12 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <span class="text-lg font-semibold text-gray-300">Choose an image</span>
                        <p class="text-sm text-gray-400">or drag and drop here</p>
                    </div>
                </label>
                <input type="file" id="file-input" class="hidden" accept="image/*">
            </div>

            <!-- Image Preview -->
            <div id="image-preview-container" class="hidden mb-6 flex justify-center">
                <img id="image-preview" src="#" alt="Image Preview" class="max-w-full h-auto rounded-lg shadow-md max-h-96">
            </div>
            
            <!-- Analysis Button -->
            <button id="upload-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                Analyze Image
            </button>
        </div>

        <!-- Loading and Results Section -->
        <div id="processing-state" class="hidden flex flex-col items-center justify-center p-8 text-center">
            <!-- Loading Spinner -->
            <div id="loading-spinner" class="spinner ease-linear rounded-full border-8 border-t-8 border-gray-200 h-16 w-16 mb-4"></div>
            <p class="text-lg text-gray-400 font-semibold">Analyzing image...</p>
        </div>

        <!-- Results Display Section -->
        <div id="results-container" class="hidden mt-8 p-6 bg-gray-700 rounded-lg shadow-inner">
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4">
                <div class="text-xl font-bold">
                    Diagnosis: <span id="diagnosis-text" class="text-blue-400"></span>
                </div>
            </div>
            
            <p id="message-text" class="text-gray-300 mb-4"></p>
            
            <h3 class="text-lg font-semibold text-gray-200 mb-2">Recommendations:</h3>
            <ul id="recommendations-list" class="list-disc list-inside text-gray-400 space-y-1">
                <!-- Recommendations will be populated here -->
            </ul>
        </div>
        
        <!-- Try Again Button -->
        <div id="try-again-container" class="hidden text-center mt-6">
            <button id="try-again-btn" class="bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                Try Another Image
            </button>
        </div>
    </div>

    <script>
        // Get references to all the important HTML elements
        const fileInput = document.getElementById('file-input');
        const uploadBox = document.getElementById('upload-box');
        const imagePreviewContainer = document.getElementById('image-preview-container');
        const imagePreview = document.getElementById('image-preview');
        const uploadBtn = document.getElementById('upload-btn');
        const mainContent = document.getElementById('main-content');
        const processingState = document.getElementById('processing-state');
        const resultsContainer = document.getElementById('results-container');
        const diagnosisText = document.getElementById('diagnosis-text');
        const messageText = document.getElementById('message-text');
        const recommendationsList = document.getElementById('recommendations-list');
        const tryAgainContainer = document.getElementById('try-again-container');
        const tryAgainBtn = document.getElementById('try-again-btn');

        // Event listener to show a live preview of the selected image
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                    uploadBtn.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Event listener for drag-and-drop functionality
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadBox.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        uploadBox.addEventListener('dragenter', highlight, false);
        uploadBox.addEventListener('dragover', highlight, false);
        uploadBox.addEventListener('dragleave', unhighlight, false);
        uploadBox.addEventListener('drop', handleDrop, false);

        function highlight(e) {
            uploadBox.classList.add('border-blue-400');
            uploadBox.classList.add('bg-gray-700');
        }

        function unhighlight(e) {
            uploadBox.classList.remove('border-blue-400');
            uploadBox.classList.remove('bg-gray-700');
        }

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files; // Assign files to the input element
            
            const file = files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    imagePreviewContainer.classList.remove('hidden');
                    uploadBtn.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        // Event listener for the "Analyze Image" button
        uploadBtn.addEventListener('click', async function() {
            const file = fileInput.files[0];
            if (!file) {
                alert("Please select an image first.");
                return;
            }

            // Show the loading state and hide the main content
            mainContent.classList.add('hidden');
            processingState.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            tryAgainContainer.classList.add('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                // Display the results
                diagnosisText.textContent = result.diagnosis;
                messageText.textContent = result.message;

                // Clear previous recommendations
                recommendationsList.innerHTML = '';
                result.recommendations.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    recommendationsList.appendChild(li);
                });

                // Show the results and try again button
                processingState.classList.add('hidden');
                resultsContainer.classList.remove('hidden');
                tryAgainContainer.classList.remove('hidden');

            } catch (error) {
                console.error('Error during analysis:', error);
                
                // Show a friendly error message
                diagnosisText.textContent = 'Analysis Failed';
                messageText.textContent = 'An error occurred during the analysis. Please try again.';
                recommendationsList.innerHTML = '';

                // Show the results and try again button
                processingState.classList.add('hidden');
                resultsContainer.classList.remove('hidden');
                tryAgainContainer.classList.remove('hidden');
            }
        });
        
        // Event listener for the "Try Again" button
        tryAgainBtn.addEventListener('click', function() {
            // Reset the UI to its initial state
            mainContent.classList.remove('hidden');
            resultsContainer.classList.add('hidden');
            tryAgainContainer.classList.add('hidden');
            imagePreviewContainer.classList.add('hidden');
            fileInput.value = ''; // Clear the file input
        });

    </script>
</body>
</html>
